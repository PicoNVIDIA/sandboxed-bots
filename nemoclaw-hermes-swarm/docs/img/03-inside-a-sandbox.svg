<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#0b0d0b"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <text x="48" y="52" fill="#e5e7eb" font-size="22" font-weight="700">Inside one NemoClaw sandbox</text>
  <text x="48" y="76" fill="#9ca3af" font-size="13">What the bot can see, what it can reach, and where the line is. Every claim here is a check in ./swarm test.</text>

  <!-- host outline -->
  <rect x="48" y="104" width="1104" height="440" rx="14" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="68" y="126" fill="#9ca3af" font-size="11" letter-spacing="2">HOST</text>
  <text x="1132" y="126" fill="#6b7280" font-size="10.5" text-anchor="end">pid-ns 4026531836 · 2,799 processes</text>

  <!-- sandbox -->
  <rect x="80" y="150" width="620" height="370" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="100" y="178" fill="#76b900" font-size="12" font-weight="700" letter-spacing="1.5">SANDBOX · nemoclaw-reviewer</text>
  <text x="100" y="196" fill="#9ca3af" font-size="10.5">pid-ns 4026542133 · 8 processes · its own network, mount, and IPC namespaces</text>

  <!-- filesystem -->
  <rect x="100" y="214" width="280" height="140" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="116" y="238" fill="#e5e7eb" font-size="12" font-weight="700">filesystem</text>
  <text x="116" y="260" fill="#76b900" font-size="10.5">rw  /sandbox  /sandbox/.hermes  /tmp</text>
  <text x="116" y="278" fill="#9ca3af" font-size="10.5">ro  /usr  /lib  /etc</text>
  <text x="116" y="296" fill="#f87171" font-size="10.5">✕   host home, other sandboxes, docker.sock</text>
  <text x="116" y="322" fill="#6b7280" font-size="10">SOUL.md here starts "# Reviewer"; the</text>
  <text x="116" y="338" fill="#6b7280" font-size="10">researcher's, same path, "# Researcher".</text>

  <!-- process -->
  <rect x="400" y="214" width="280" height="140" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="416" y="238" fill="#e5e7eb" font-size="12" font-weight="700">process</text>
  <text x="416" y="260" fill="#d1d5db" font-size="10.5">hermes gateway run   (api_server :8478)</text>
  <text x="416" y="278" fill="#d1d5db" font-size="10.5">└ agent loop  └ tool subprocesses</text>
  <text x="416" y="296" fill="#f87171" font-size="10.5">✕   no CAP_SYS_ADMIN, Landlock on</text>
  <text x="416" y="322" fill="#6b7280" font-size="10">`hostname` via the terminal tool returns</text>
  <text x="416" y="338" fill="#6b7280" font-size="10">the container id, never the host's.</text>

  <!-- secrets -->
  <rect x="100" y="372" width="580" height="60" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="116" y="396" fill="#e5e7eb" font-size="12" font-weight="700">what it holds</text>
  <text x="116" y="416" fill="#d1d5db" font-size="10.5">its own API_SERVER_KEY · the inference key · keys of teammates it may message. Nothing else.</text>

  <!-- egress -->
  <rect x="100" y="448" width="580" height="56" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="116" y="472" fill="#e5e7eb" font-size="12" font-weight="700">egress  (deny by default, enforced by the OpenShell proxy)</text>
  <text x="116" y="491" fill="#9ca3af" font-size="10.5">policy = base template + additive presets: otlp-export, peer-nemoclaw-researcher</text>

  <!-- arrows out -->
  <line x1="700" y1="300" x2="800" y2="300" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="804" y="278" width="320" height="44" rx="8" fill="#111611" stroke="#374151"/>
  <text x="820" y="297" fill="#e5e7eb" font-size="11.5" font-weight="700">inference endpoint</text>
  <text x="820" y="313" fill="#76b900" font-size="10.5">allowed · 200</text>

  <line x1="700" y1="360" x2="800" y2="360" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="804" y="338" width="320" height="44" rx="8" fill="#111611" stroke="#374151"/>
  <text x="820" y="357" fill="#e5e7eb" font-size="11.5" font-weight="700">nemoclaw-researcher api_server :8477</text>
  <text x="820" y="373" fill="#76b900" font-size="10.5">allowed with the researcher's key · 200</text>

  <line x1="700" y1="420" x2="800" y2="420" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="804" y="398" width="320" height="44" rx="8" fill="#111611" stroke="#374151"/>
  <text x="820" y="417" fill="#e5e7eb" font-size="11.5" font-weight="700">collector 172.18.0.1:4319</text>
  <text x="820" y="433" fill="#76b900" font-size="10.5">allowed · spans land</text>

  <line x1="700" y1="480" x2="800" y2="480" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <rect x="804" y="458" width="320" height="44" rx="8" fill="#111611" stroke="#7f1d1d"/>
  <text x="820" y="477" fill="#e5e7eb" font-size="11.5" font-weight="700">example.com · host 127.0.0.1 · GitHub</text>
  <text x="820" y="493" fill="#f87171" font-size="10.5">denied · 403 policy_denied</text>

  <text x="48" y="576" fill="#6b7280" font-size="10.5">Want the reviewer to read GitHub? Drop a preset at policies/nemoclaw-reviewer.yaml. The researcher already has one; that asymmetry is the point.</text>
</svg>
