<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" x2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="0.55" stop-color="#4b5f2a"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="#0b0d0b"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <text x="48" y="52" fill="#e5e7eb" font-size="22" font-weight="700">Session, agent, bot: the same word hides three very different things</text>
  <text x="48" y="76" fill="#9ca3af" font-size="13">The further right you go, the more the thing can do on its own, and the more you need a boundary around it.</text>

  <!-- spectrum bar -->
  <rect x="48" y="110" width="1104" height="10" rx="5" fill="url(#spectrum)"/>
  <text x="48" y="140" fill="#9ca3af" font-size="10.5">you drive every step</text>
  <text x="1152" y="140" fill="#76b900" font-size="10.5" text-anchor="end">it runs while you sleep</text>

  <!-- column 1: session -->
  <g>
    <rect x="48" y="164" width="340" height="330" rx="12" fill="#111611" stroke="#374151" stroke-width="1.5"/>
    <text x="68" y="196" fill="#e5e7eb" font-size="15" font-weight="700">A session</text>
    <text x="68" y="216" fill="#9ca3af" font-size="11">ChatGPT · Grok · a Claude chat tab</text>
    <line x1="68" y1="232" x2="368" y2="232" stroke="#1f2937"/>
    <text x="68" y="260" fill="#d1d5db" font-size="11.5">Lives as long as the tab. Answers questions.</text>
    <text x="68" y="280" fill="#d1d5db" font-size="11.5">Might browse. Does not run your shell, does</text>
    <text x="68" y="300" fill="#d1d5db" font-size="11.5">not hold your keys, forgets you on close.</text>
    <text x="68" y="340" fill="#9ca3af" font-size="11">persists:</text>
    <text x="184" y="340" fill="#f87171" font-size="11">no</text>
    <text x="68" y="360" fill="#9ca3af" font-size="11">runs tools:</text>
    <text x="184" y="360" fill="#fbbf24" font-size="11">sometimes, hosted</text>
    <text x="68" y="380" fill="#9ca3af" font-size="11">holds creds:</text>
    <text x="184" y="380" fill="#f87171" font-size="11">no</text>
    <text x="68" y="400" fill="#9ca3af" font-size="11">talks to peers:</text>
    <text x="184" y="400" fill="#f87171" font-size="11">no</text>
    <text x="68" y="440" fill="#6b7280" font-size="10.5">Blast radius if it goes wrong:</text>
    <text x="68" y="458" fill="#d1d5db" font-size="11">a bad answer.</text>
  </g>

  <!-- column 2: agent -->
  <g>
    <rect x="430" y="164" width="340" height="330" rx="12" fill="#111611" stroke="#4b5f2a" stroke-width="1.5"/>
    <text x="450" y="196" fill="#e5e7eb" font-size="15" font-weight="700">An agent</text>
    <text x="450" y="216" fill="#9ca3af" font-size="11">Claude Code · Codex · OpenCode · a Hermes CLI run</text>
    <line x1="450" y1="232" x2="750" y2="232" stroke="#1f2937"/>
    <text x="450" y="260" fill="#d1d5db" font-size="11.5">Takes a task, runs your shell and editor,</text>
    <text x="450" y="280" fill="#d1d5db" font-size="11.5">loops until done, hands back a result. You</text>
    <text x="450" y="300" fill="#d1d5db" font-size="11.5">start it, you watch it, it exits.</text>
    <text x="450" y="340" fill="#9ca3af" font-size="11">persists:</text>
    <text x="566" y="340" fill="#fbbf24" font-size="11">for the task</text>
    <text x="450" y="360" fill="#9ca3af" font-size="11">runs tools:</text>
    <text x="566" y="360" fill="#76b900" font-size="11">yes, on your machine</text>
    <text x="450" y="380" fill="#9ca3af" font-size="11">holds creds:</text>
    <text x="566" y="380" fill="#fbbf24" font-size="11">yours, while it runs</text>
    <text x="450" y="400" fill="#9ca3af" font-size="11">talks to peers:</text>
    <text x="566" y="400" fill="#fbbf24" font-size="11">subagents it spawns</text>
    <text x="450" y="440" fill="#6b7280" font-size="10.5">Blast radius if it goes wrong:</text>
    <text x="450" y="458" fill="#d1d5db" font-size="11">whatever you had open, once.</text>
  </g>

  <!-- column 3: bot -->
  <g>
    <rect x="812" y="164" width="340" height="330" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
    <text x="832" y="196" fill="#e5e7eb" font-size="15" font-weight="700">A bot</text>
    <text x="832" y="216" fill="#76b900" font-size="11">Hermes Bots · what this repo runs</text>
    <line x1="832" y1="232" x2="1132" y2="232" stroke="#2d3a2d"/>
    <text x="832" y="260" fill="#d1d5db" font-size="11.5">Has a name, a role, its own memory, tools,</text>
    <text x="832" y="280" fill="#d1d5db" font-size="11.5">credentials and routines. Stays up. Gets</text>
    <text x="832" y="300" fill="#d1d5db" font-size="11.5">@mentioned. Messages other bots on its own.</text>
    <text x="832" y="340" fill="#9ca3af" font-size="11">persists:</text>
    <text x="948" y="340" fill="#76b900" font-size="11">indefinitely</text>
    <text x="832" y="360" fill="#9ca3af" font-size="11">runs tools:</text>
    <text x="948" y="360" fill="#76b900" font-size="11">yes, unattended</text>
    <text x="832" y="380" fill="#9ca3af" font-size="11">holds creds:</text>
    <text x="948" y="380" fill="#76b900" font-size="11">its own, always</text>
    <text x="832" y="400" fill="#9ca3af" font-size="11">talks to peers:</text>
    <text x="948" y="400" fill="#76b900" font-size="11">yes, other bots</text>
    <text x="832" y="440" fill="#6b7280" font-size="10.5">Blast radius if it goes wrong:</text>
    <text x="832" y="458" fill="#f87171" font-size="11">everything it can reach, forever.</text>
    <text x="832" y="476" fill="#76b900" font-size="11" font-weight="700">Which is why each one gets a NemoClaw sandbox.</text>
  </g>

  <text x="48" y="536" fill="#6b7280" font-size="10.5">Hermes is open source (MIT) and runs the same agent core as a CLI, a TUI, a messaging gateway, and Desktop bots. The bot is the shape; the sandbox is the boundary.</text>
</svg>
