<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#0b0d0b"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <text x="48" y="52" fill="#e5e7eb" font-size="22" font-weight="700">NeMo Relay: what the bot actually did</text>
  <text x="48" y="76" fill="#9ca3af" font-size="13">Relay ships inside Hermes. One TOML file per bot turns it on; spans leave the sandbox to a collector you control.</text>

  <!-- pipeline -->
  <rect x="48" y="110" width="200" height="64" rx="10" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="148" y="136" fill="#76b900" font-size="12" font-weight="700" text-anchor="middle">sandbox</text>
  <text x="148" y="156" fill="#9ca3af" font-size="10.5" text-anchor="middle">Hermes + Relay in-process</text>

  <line x1="248" y1="142" x2="318" y2="142" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="132" fill="#9ca3af" font-size="9.5" text-anchor="middle">OTLP/HTTP</text>

  <rect x="322" y="110" width="220" height="64" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="432" y="136" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">collector · host :4319</text>
  <text x="432" y="156" fill="#9ca3af" font-size="10.5" text-anchor="middle">roots spans · holds the keys</text>

  <line x1="542" y1="142" x2="612" y2="142" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="616" y="110" width="200" height="64" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="716" y="136" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">LangSmith · Phoenix</text>
  <text x="716" y="156" fill="#9ca3af" font-size="10.5" text-anchor="middle">or any OTLP backend, optional</text>

  <rect x="856" y="110" width="296" height="64" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="1004" y="130" fill="#e5e7eb" font-size="11" font-weight="700" text-anchor="middle">the only trustworthy signal</text>
  <text x="1004" y="147" fill="#76b900" font-size="10.5" text-anchor="middle">otelcol_exporter_sent_spans   45</text>
  <text x="1004" y="163" fill="#76b900" font-size="10.5" text-anchor="middle">otelcol_exporter_send_failed   0</text>

  <!-- span tree -->
  <rect x="48" y="200" width="560" height="272" rx="10" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="68" y="226" fill="#e5e7eb" font-size="12" font-weight="700">one turn, as a trace</text>
  <g font-size="11">
    <text x="68" y="256" fill="#76b900">hermes.turn</text><text x="380" y="256" fill="#6b7280">agent.name=nemoclaw-researcher</text>
    <text x="68" y="278" fill="#d1d5db">└─ hermes.task_run</text>
    <text x="68" y="300" fill="#d1d5db">   ├─ hermes.logical_llm_call</text>
    <text x="68" y="322" fill="#d1d5db">   │  └─ chat nemotron-3-super</text><text x="440" y="322" fill="#6b7280">in 3,372 · out 212 tok</text>
    <text x="68" y="344" fill="#d1d5db">   ├─ tool.call terminal</text><text x="440" y="344" fill="#6b7280">hostname → 4118c85bffc1</text>
    <text x="68" y="366" fill="#d1d5db">   ├─ hermes.logical_llm_call</text>
    <text x="68" y="388" fill="#d1d5db">   ├─ tool.call message_teammate</text><text x="440" y="388" fill="#6b7280">→ nemoclaw-reviewer</text>
    <text x="68" y="410" fill="#d1d5db">   └─ hermes.logical_llm_call</text><text x="440" y="410" fill="#6b7280">finish_reason=stop</text>
  </g>
  <text x="68" y="450" fill="#6b7280" font-size="10">gen_ai.* attributes per span: model, input/output messages, token usage, finish reasons</text>

  <!-- why -->
  <rect x="640" y="200" width="512" height="272" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="660" y="226" fill="#e5e7eb" font-size="12" font-weight="700">four failures a trace catches at a glance</text>
  <g font-size="10.5">
    <text x="660" y="258" fill="#d1d5db">a bot got no work while the others replied</text>
    <text x="680" y="274" fill="#76b900">→ no hermes.turn for it in the round</text>
    <text x="660" y="304" fill="#d1d5db">a chained task deadlocked</text>
    <text x="680" y="320" fill="#76b900">→ a turn that closes with zero tool.call children</text>
    <text x="660" y="350" fill="#d1d5db">a bot "verified" sources it invented</text>
    <text x="680" y="366" fill="#76b900">→ a confident turn with no tool spans under it</text>
    <text x="660" y="396" fill="#d1d5db">a bot says (pass); broken or fine?</text>
    <text x="680" y="412" fill="#76b900">→ completed turn, short output: fine</text>
  </g>
  <text x="660" y="450" fill="#6b7280" font-size="10">The third one took an hour to catch by hand.</text>

  <text x="48" y="500" fill="#6b7280" font-size="10.5">A handoff is two trees today (one per bot). Linking them needs a header the api_server does not read yet; documented, not hidden.</text>
</svg>
