<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#0b0d0b"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <text x="48" y="52" fill="#e5e7eb" font-size="22" font-weight="700">A handoff crosses two sandbox walls</text>
  <text x="48" y="76" fill="#9ca3af" font-size="13">"@nemoclaw-researcher find X, then hand it to @nemoclaw-reviewer." What actually moves, and what does not.</text>

  <!-- step numbers -->
  <g font-size="11" font-weight="700">
    <circle cx="120" cy="150" r="11" fill="#76b900"/><text x="120" y="154" fill="#0b0d0b" text-anchor="middle">1</text>
    <circle cx="600" cy="150" r="11" fill="#76b900"/><text x="600" y="154" fill="#0b0d0b" text-anchor="middle">2</text>
    <circle cx="600" cy="386" r="11" fill="#76b900"/><text x="600" y="390" fill="#0b0d0b" text-anchor="middle">3</text>
    <circle cx="1080" cy="150" r="11" fill="#76b900"/><text x="1080" y="154" fill="#0b0d0b" text-anchor="middle">4</text>
  </g>

  <!-- desktop -->
  <rect x="48" y="174" width="144" height="150" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="200" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">Desktop</text>
  <text x="120" y="222" fill="#9ca3af" font-size="10.5" text-anchor="middle">group chat</text>
  <text x="120" y="256" fill="#d1d5db" font-size="10.5" text-anchor="middle">you type once</text>
  <text x="120" y="272" fill="#d1d5db" font-size="10.5" text-anchor="middle">the room routes</text>
  <text x="120" y="288" fill="#d1d5db" font-size="10.5" text-anchor="middle">to the @mention</text>

  <line x1="192" y1="250" x2="262" y2="250" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- researcher sandbox -->
  <rect x="266" y="174" width="420" height="150" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="286" y="200" fill="#76b900" font-size="12" font-weight="700" letter-spacing="1.5">SANDBOX · nemoclaw-researcher</text>
  <text x="286" y="224" fill="#d1d5db" font-size="10.5">runs the task with its own tools and memory</text>
  <text x="286" y="242" fill="#d1d5db" font-size="10.5">decides the reviewer should see the result</text>
  <rect x="286" y="258" width="380" height="48" rx="6" fill="#0b0d0b" stroke="#2d3a2d"/>
  <text x="300" y="278" fill="#76b900" font-size="10.5">message_teammate(</text>
  <text x="300" y="295" fill="#d1d5db" font-size="10.5">  "nemoclaw-reviewer", "Findings: … please review")</text>

  <!-- the wire -->
  <line x1="686" y1="250" x2="756" y2="250" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="238" fill="#9ca3af" font-size="9.5" text-anchor="middle">bridge</text>
  <text x="721" y="268" fill="#9ca3af" font-size="9.5" text-anchor="middle">:8478</text>

  <!-- reviewer sandbox -->
  <rect x="760" y="174" width="392" height="150" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="780" y="200" fill="#76b900" font-size="12" font-weight="700" letter-spacing="1.5">SANDBOX · nemoclaw-reviewer</text>
  <text x="780" y="224" fill="#d1d5db" font-size="10.5">api_server checks the bearer key</text>
  <text x="780" y="242" fill="#d1d5db" font-size="10.5">runs one turn in its own Bot Chat, with its own</text>
  <text x="780" y="260" fill="#d1d5db" font-size="10.5">SOUL, its own memory, its own (tighter) policy</text>
  <text x="780" y="292" fill="#d1d5db" font-size="10.5">replies; the reply lands back in the researcher's turn</text>

  <!-- what crosses -->
  <rect x="266" y="352" width="886" height="120" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="286" y="378" fill="#e5e7eb" font-size="12" font-weight="700">what crosses the wall</text>
  <text x="286" y="402" fill="#76b900" font-size="11">✓ one HTTP request: message text + the reviewer's api key</text>
  <text x="286" y="422" fill="#76b900" font-size="11">✓ the reply text</text>
  <text x="740" y="402" fill="#f87171" font-size="11">✕ files, memory, sessions, shell of either bot</text>
  <text x="740" y="422" fill="#f87171" font-size="11">✕ the researcher's own credentials</text>
  <text x="286" y="452" fill="#9ca3af" font-size="10.5">./swarm add wires all three parts: a peer entry inside the sender, an egress rule for the receiver's port, the teammates tool.</text>

  <text x="48" y="500" fill="#6b7280" font-size="10.5">./swarm test plants a secret only the reviewer can read and checks the researcher retrieves it through this path and no other.</text>
</svg>
