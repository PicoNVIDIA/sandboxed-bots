<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#0b0d0b"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- title -->
  <text x="48" y="52" fill="#e5e7eb" font-size="22" font-weight="700">One request, three NVIDIA layers</text>
  <text x="48" y="76" fill="#9ca3af" font-size="13">You @mention a bot in Hermes Desktop. Here is everything that happens before you see the reply.</text>

  <!-- laptop -->
  <g>
    <rect x="48" y="130" width="200" height="120" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
    <text x="148" y="160" fill="#e5e7eb" font-size="13" font-weight="700" text-anchor="middle">Hermes Desktop</text>
    <text x="148" y="180" fill="#9ca3af" font-size="11" text-anchor="middle">your laptop</text>
    <rect x="68" y="196" width="160" height="36" rx="6" fill="#0b0d0b" stroke="#1f2937"/>
    <text x="80" y="219" fill="#76b900" font-size="12">@nemoclaw-researcher …</text>
  </g>

  <!-- arrow laptop -> host -->
  <line x1="248" y1="190" x2="318" y2="190" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="180" fill="#9ca3af" font-size="10" text-anchor="middle">SSH</text>

  <!-- host boundary -->
  <rect x="320" y="104" width="832" height="500" rx="14" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="340" y="126" fill="#9ca3af" font-size="11" letter-spacing="2">HOST · Linux + Docker + NVIDIA OpenShell</text>

  <!-- host gateway -->
  <g>
    <rect x="344" y="150" width="220" height="80" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
    <text x="454" y="178" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">host profile</text>
    <text x="454" y="196" fill="#9ca3af" font-size="10.5" text-anchor="middle">hermes -p nemoclaw-researcher</text>
    <text x="454" y="212" fill="#6b7280" font-size="10" text-anchor="middle">thin client · what the roster lists</text>
  </g>

  <!-- arrow host gw -> sandbox -->
  <line x1="454" y1="230" x2="454" y2="292" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="266" fill="#9ca3af" font-size="10">bridge 172.18.0.1:8477</text>

  <!-- NemoClaw sandbox -->
  <g filter="url(#glow)">
    <rect x="344" y="296" width="440" height="270" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  </g>
  <text x="364" y="322" fill="#76b900" font-size="12" font-weight="700" letter-spacing="1.5">NEMOCLAW SANDBOX · nemoclaw-researcher</text>
  <text x="364" y="340" fill="#9ca3af" font-size="10.5">own PID · NET · MNT namespaces  ·  deny-by-default egress  ·  Hermes 0.21 baked in</text>

  <!-- inside sandbox: hermes -->
  <rect x="364" y="358" width="400" height="60" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="380" y="382" fill="#e5e7eb" font-size="12" font-weight="700">Hermes Agent</text>
  <text x="380" y="400" fill="#9ca3af" font-size="10.5">api_server :8477 · agent loop · SOUL.md · memory · tools run here</text>

  <!-- inside sandbox: relay -->
  <rect x="364" y="432" width="190" height="52" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="380" y="454" fill="#e5e7eb" font-size="12" font-weight="700">NeMo Relay</text>
  <text x="380" y="471" fill="#9ca3af" font-size="10.5">in-process · gen_ai spans</text>

  <!-- inside sandbox: policy -->
  <rect x="574" y="432" width="190" height="52" rx="8" fill="#0f140f" stroke="#2d3a2d"/>
  <text x="590" y="454" fill="#e5e7eb" font-size="12" font-weight="700">egress policy</text>
  <text x="590" y="471" fill="#9ca3af" font-size="10.5">allow: model, collector, peers</text>

  <!-- denied -->
  <text x="364" y="520" fill="#f87171" font-size="10.5">✕ example.com  ✕ host 127.0.0.1  ✕ other sandboxes' files  ✕ pip / GitHub (unless you add it)</text>
  <text x="364" y="546" fill="#76b900" font-size="10.5">✓ inference endpoint  ✓ collector :4319  ✓ nemoclaw-reviewer :8478</text>

  <!-- arrow sandbox -> inference -->
  <line x1="784" y1="388" x2="866" y2="388" stroke="#76b900" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="870" y="352" width="256" height="72" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="998" y="378" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">inference endpoint</text>
  <text x="998" y="396" fill="#9ca3af" font-size="10.5" text-anchor="middle">OpenAI-compatible · NIM, hosted API,</text>
  <text x="998" y="411" fill="#9ca3af" font-size="10.5" text-anchor="middle">vLLM, SGLang · shared by every bot</text>

  <!-- arrow relay -> collector -->
  <line x1="554" y1="458" x2="866" y2="458" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <rect x="870" y="440" width="256" height="60" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="998" y="463" fill="#e5e7eb" font-size="12" font-weight="700" text-anchor="middle">OpenTelemetry collector</text>
  <text x="998" y="481" fill="#9ca3af" font-size="10.5" text-anchor="middle">on the host · keys stay here</text>

  <!-- arrow collector -> langsmith -->
  <line x1="998" y1="500" x2="998" y2="536" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <rect x="870" y="540" width="256" height="44" rx="10" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="998" y="567" fill="#9ca3af" font-size="11" text-anchor="middle">LangSmith / Phoenix / any OTLP backend (optional)</text>

  <!-- footer -->
  <text x="48" y="620" fill="#6b7280" font-size="10.5">Hermes decides what to do. NemoClaw decides what it is allowed to touch. NeMo Relay shows you what it did.</text>
</svg>
