version: 3
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /dev/urandom
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  - /dev/pts
  - /home/sandbox
  - /sandbox/.hermes
  - /var/tmp
landlock:
  compatibility: best_effort
network_policies:
  host-inference:
    binaries:
    - path: /usr/bin/python3
    - path: /usr/bin/curl
    - path: /sandbox/.hermes/hermes-agent/venv/bin/python
    - path: /sandbox/.hermes/bin/uv
    - path: /sandbox/.hermes/bin/*
    - path: /sandbox/.hermes/node/bin/node
    - path: /sandbox/.hermes/node/bin/npm
    - path: /sandbox/.hermes/hermes-agent/venv/bin/*
    - path: /usr/bin/python3.11
    - path: /bin/sh
    - path: /bin/bash
    endpoints:
    - host: host.openshell.internal
      port: 18001
      access: full
      tls: skip
    - host: 172.18.0.1
      port: 18001
      access: full
      tls: skip
  peer-beta:
    binaries:
    - path: /usr/bin/python3
    - path: /usr/bin/curl
    - path: /sandbox/.hermes/hermes-agent/venv/bin/python
    - path: /sandbox/.hermes/bin/uv
    - path: /sandbox/.hermes/bin/*
    - path: /sandbox/.hermes/node/bin/node
    - path: /sandbox/.hermes/node/bin/npm
    - path: /sandbox/.hermes/hermes-agent/venv/bin/*
    - path: /usr/bin/python3.11
    - path: /bin/sh
    - path: /bin/bash
    endpoints:
    - host: host.openshell.internal
      port: 8478
      access: full
      tls: skip
    - host: 172.18.0.1
      port: 8478
      access: full
      tls: skip
  install:
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/python3
    - path: /usr/bin/git
    - path: /sandbox/.hermes/bin/uv
    - path: /sandbox/.hermes/bin/*
    - path: /sandbox/.hermes/node/bin/node
    - path: /sandbox/.hermes/node/bin/npm
    - path: /sandbox/.hermes/hermes-agent/venv/bin/python
    - path: /sandbox/.hermes/hermes-agent/venv/bin/*
    - path: /usr/bin/python3.11
    - path: /bin/sh
    - path: /bin/bash
    endpoints:
    - host: hermes-agent.nousresearch.com
      port: 443
      access: full
      tls: skip
    - host: github.com
      port: 443
      access: full
      tls: skip
    - host: codeload.github.com
      port: 443
      access: full
      tls: skip
    - host: objects.githubusercontent.com
      port: 443
      access: full
      tls: skip
    - host: raw.githubusercontent.com
      port: 443
      access: full
      tls: skip
    - host: pypi.org
      port: 443
      access: full
      tls: skip
    - host: files.pythonhosted.org
      port: 443
      access: full
      tls: skip
    - host: astral.sh
      port: 443
      access: full
      tls: skip
    - host: releases.astral.sh
      port: 443
      access: full
      tls: skip
    - host: pypi.python.org
      port: 443
      access: full
      tls: skip
    - host: registry.npmjs.org
      port: 443
      access: full
      tls: skip
    - host: nodejs.org
      port: 443
      access: full
      tls: skip
    - host: api.github.com
      port: 443
      access: full
      tls: skip
    - host: install.python-poetry.org
      port: 443
      access: full
      tls: skip
    - host: deb.debian.org
      port: 443
      access: full
      tls: skip
    - host: archive.ubuntu.com
      port: 443
      access: full
      tls: skip
    - host: security.ubuntu.com
      port: 443
      access: full
      tls: skip
    - host: ghcr.io
      port: 443
      access: full
      tls: skip
    - host: pkg-containers.githubusercontent.com
      port: 443
      access: full
